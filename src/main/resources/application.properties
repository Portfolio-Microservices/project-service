spring.application.name=project-service
server.port=8082

# JWT validation for incoming requests from auth-service
jwt.secret=ReplaceThisSecretWithASecureLongKey
jwt.expiration=900000
jwt.refreshExpiration=604800000

spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# retry
resilience4j.retry.instances.contentService.max-attempts=3
resilience4j.retry.instances.contentService.wait-duration=1s
resilience4j.retry.instances.contentService.enable-exponential-backoff=true
resilience4j.retry.instances.contentService.exponential-backoff-multiplier=2

# circuit breaker
resilience4j.circuitbreaker.instances.contentService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.contentService.sliding-window-size=10

resilience4j.circuitbreaker.instances.contentService.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.contentService.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.contentService.permitted-number-of-calls-in-half-open-state=3